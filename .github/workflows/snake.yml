name: Gerar animação da teia de contribuições

on:
  schedule:
    - cron: "43 6 * * *" # todo dia, 03:43 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribuicoes.svg?palette=github-dark&color_snake=#E62429&color_dots=#161b22,#0e2a6b,#1F4FD1,#3B6BF0,#9db8ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
