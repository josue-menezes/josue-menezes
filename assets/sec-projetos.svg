<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="58" viewBox="0 0 1000 58">
<style>
.blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.scan{animation:scan 6s linear infinite} @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1100px)}}
.ok{opacity:0;animation:ok .6s ease-out 1.6s forwards} @keyframes ok{to{opacity:1}}
.swing{transform-origin:46px 0;animation:swing 3s ease-in-out infinite} @keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
</style>
<defs>
  <linearGradient id="bge" x1="0" x2="1"><stop offset="0" stop-color="#13213F"/><stop offset="1" stop-color="#0B1426"/></linearGradient>
  <linearGradient id="sweepe" x1="0" x2="1"><stop offset="0" stop-color="#E62429" stop-opacity="0"/><stop offset=".5" stop-color="#E62429" stop-opacity=".18"/><stop offset="1" stop-color="#E62429" stop-opacity="0"/></linearGradient>
  <clipPath id="ce"><rect width="1000" height="58" rx="10"/></clipPath>
</defs>
<g clip-path="url(#ce)">
  <rect width="1000" height="58" fill="url(#bge)"/>
  <rect class="scan" width="260" height="58" fill="url(#sweepe)"/>
  <rect width="5" height="58" fill="#E62429"/>
  <g class="swing"><line x1="46" y1="0" x2="46" y2="20" stroke="#C9D6FF" stroke-opacity=".6"/><g transform="translate(46 28)"><g transform="scale(0.75)"><g fill="#E62429">
  <ellipse cx="0" cy="6" rx="7" ry="9"/><circle cx="0" cy="-5" r="5"/>
  <g stroke="#E62429" stroke-width="2" fill="none" stroke-linecap="round">
